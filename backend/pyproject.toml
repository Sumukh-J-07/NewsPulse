[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspulse"
version = "1.0.0"
description = "NewsPulse: news-informed next-session market outlook research prototype (backend, pipeline, models, API)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "yfinance>=0.2.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["newspulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
